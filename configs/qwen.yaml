server:
  base_url: http://127.0.0.1:8000/v1
dataset:
  repo_id: dddraxxx/ref-adv-s
  split: train
  start_index: 0
  limit: 0
  token_env: HF_TOKEN
  filter:
    human_authored: null
    image_source: null
generation:
  max_tokens: 1024
  temperature: 0.0
  top_p: 1.0
  seed: 7
  timeout_sec: 180
evaluation:
  iou_threshold: 0.5
  retry_followup_on_parse_fail: true
  retry_followup_length_only: false
  retry_followup_max_tokens: 1024
  retry_followup_text: 'Your previous answer did not end with a valid JSON bbox output.\nNow
    output ONLY one complete JSON code block.\nUse this exact schema:\n```json\n{"bboxes":
    [[x1, y1, x2, y2]]}\n```\nDo not output any extra text.'
prompts:
  direct: '<image>

    Locate every object that matches the description "{ref_sentence}" in the image.
    Report bbox coordinates in JSON format.'
  cot: '<image>

    Locate every object that matches the description "{ref_sentence}" in the image.

    Think first, then answer.

    Finally report bbox coordinates in JSON format.'
output:
  dir: grounding_eval_repro/outputs/qwen
models:
  qwen25a32b:
    model_full_name: Qwen/Qwen2.5-VL-32B-Instruct
    pred_box_expected_format: abs_xyxy
